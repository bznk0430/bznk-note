<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本票產生器 — BZNK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f4f0;min-height:100vh;display:flex;justify-content:center;padding:32px 16px 60px}
.wrap{width:100%;max-width:680px;display:flex;flex-direction:column;gap:16px}
h1{font-size:18px;font-weight:600;color:#1a1a18}
.sub{font-size:13px;color:#666;margin-top:2px}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card-title{font-size:13px;font-weight:600;color:#444}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.field label{font-size:11px;color:#666;font-weight:500}
.field input,.field select{padding:7px 9px;border:0.5px solid rgba(0,0,0,0.2);border-radius:7px;font-size:13px;color:#1a1a18;background:#fff;outline:none;width:100%}
.field input:focus,.field select:focus{border-color:#555}
.field input[readonly]{background:#f9f8f5;color:#555}
.field input.err{border-color:#e55}
.issuer-block{border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;margin-bottom:10px}
.issuer-num{font-size:12px;font-weight:600;color:#555}
.rm-btn{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:#bbb;font-size:20px;line-height:1;padding:2px 6px}
.rm-btn:hover{color:#e55}
.add-btn{background:none;border:0.5px dashed rgba(0,0,0,0.2);border-radius:8px;padding:9px;font-size:13px;color:#777;cursor:pointer;width:100%}
.add-btn:hover{background:#f5f4f0}
.gen-btn{background:#1a1a18;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;width:100%;transition:opacity 0.15s}
.gen-btn:hover:not(:disabled){opacity:0.85}
.gen-btn:disabled{background:#ccc;cursor:not-allowed}
.msg{font-size:13px;padding:10px 14px;border-radius:8px;text-align:center}
.msg-err{background:#fce8e8;color:#a32d2d}
.msg-ok{background:#e1f5ee;color:#085041}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px}
.badge-co{background:#e6f1fb;color:#0c447c}
.badge-pe{background:#e1f5ee;color:#085041}
.preview-bar{background:#f9f8f5;border-radius:8px;padding:10px 14px;font-size:12px;color:#666;display:flex;gap:16px;flex-wrap:wrap}
.preview-bar strong{color:#1a1a18}
.hint{font-size:11px;color:#999;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <div><h1>本票產生器</h1><div class="sub">台灣聯合金融科技 · BZNK 平台</div></div>
  <div class="card">
    <div class="card-title">票面金額</div>
    <div class="row">
      <div class="field" style="flex:2"><label>金額（新台幣，數字）</label><input id="amount" type="number" min="1" placeholder="例：2500000" oninput="updatePreview()"></div>
      <div class="field" style="flex:1;min-width:110px"><label>大寫預覽</label><input id="amtCN" readonly></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">發票人資料（最多5位）</div>
    <div id="issuers"></div>
    <button class="add-btn" onclick="addIssuer()">＋ 新增發票人</button>
  </div>
  <div id="previewBar" class="preview-bar" style="display:none"></div>
  <div id="msgBox"></div>
  <button class="gen-btn" id="genBtn" onclick="generate()">產生並下載本票 PDF</button>
</div>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script>
const CN={"0":"零","1":"壹","2":"貳","3":"參","4":"肆","5":"伍","6":"陸","7":"柒","8":"捌","9":"玖"};
function toChinese(s){
  try{
    const n=parseInt(String(s).replace(/,/g,""));
    if(!n||isNaN(n))return "";
    function sec(num,u){let r="";for(let i=0;i<4;i++){const d=Math.floor(num/Math.pow(10,3-i))%10;if(d)r+=CN[d]+u[i];else if(r&&r[r.length-1]!=="零")r+="零";}return r.replace(/零+$/,"");}
    const yi=Math.floor(n/1e8),wan=Math.floor((n%1e8)/1e4),ge=n%1e4;
    let r="";
    if(yi)r+=sec(yi,["仟","佰","拾",""])+"億";
    if(wan){if(yi&&wan<1000)r+="零";r+=sec(wan,["仟","佰","拾",""])+"萬";}
    if(ge){if((yi||wan)&&ge<1000)r+="零";r+=sec(ge,["仟","佰","拾",""]);}
    return r.replace(/零+$/,"");
  }catch{return "";}
}
function validateId(val,type){
  return type==="公司"?/^\d{8}$/.test(val.trim()):/^[A-Za-z]\d{9}$/.test(val.trim());
}
let issuers=[];
function addIssuer(){
  if(issuers.length>=5){showMsg("最多只能有5位發票人","err");return;}
  issuers.push({type:"個人",name:"",id:"",address:"",rep:""});
  renderIssuers();
}
function removeIssuer(i){issuers.splice(i,1);renderIssuers();updatePreview();}
function setIssuer(i,k,v){issuers[i][k]=v;if(k==="type")renderIssuers();updatePreview();}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
function nd(iss){return iss.type==="公司"&&iss.rep?`${iss.name}  ${iss.rep}`:iss.name;}
function renderIssuers(){
  const wrap=document.getElementById("issuers");
  wrap.innerHTML="";
  issuers.forEach((iss,i)=>{
    const isCo=iss.type==="公司";
    const div=document.createElement("div");
    div.className="issuer-block";
    div.innerHTML=`
      <div style="display:flex;align-items:center">
        <span class="issuer-num">發票人 ${i+1}</span>
        <span class="badge ${isCo?"badge-co":"badge-pe"}">${iss.type}</span>
      </div>
      ${issuers.length>1?`<button class="rm-btn" onclick="removeIssuer(${i})">×</button>`:""}
      <div class="row">
        <div class="field" style="flex:0 0 85px;min-width:85px">
          <label>類型</label>
          <select onchange="setIssuer(${i},'type',this.value)">
            <option value="個人"${!isCo?" selected":""}>個人</option>
            <option value="公司"${isCo?" selected":""}>公司</option>
          </select>
        </div>
        <div class="field" style="flex:2">
          <label>${isCo?"公司名稱":"姓名"}</label>
          <input value="${esc(iss.name)}" placeholder="${isCo?"喆泰機械股份有限公司":"王小明"}" oninput="setIssuer(${i},'name',this.value)">
        </div>
        ${isCo?`<div class="field" style="flex:1;min-width:100px"><label>負責人姓名</label><input value="${esc(iss.rep)}" placeholder="吳明憲" oninput="setIssuer(${i},'rep',this.value)"></div>`:""}
      </div>
      <div class="row">
        <div class="field" style="flex:1">
          <label>${isCo?"統一編號":"身分證字號"}</label>
          <input id="id_${i}" value="${esc(iss.id)}"
            placeholder="${isCo?"8碼數字":"1英文+9數字"}"
            oninput="setIssuer(${i},'id',this.value);validateField(${i})">
          <div class="hint">${isCo?"格式：8碼數字（例：27832490）":"格式：英文1碼＋數字9碼（例：A123456789）"}</div>
        </div>
        <div class="field" style="flex:2">
          <label>地址</label>
          <input value="${esc(iss.address)}" placeholder="台中市大里區..." oninput="setIssuer(${i},'address',this.value)">
        </div>
      </div>`;
    wrap.appendChild(div);
  });
}
function validateField(i){
  const el=document.getElementById(`id_${i}`);
  if(!el)return;
  el.classList.toggle("err", !!issuers[i].id && !validateId(issuers[i].id, issuers[i].type));
}
function updatePreview(){
  const amt=document.getElementById("amount").value;
  document.getElementById("amtCN").value=toChinese(amt)||"";
  const bar=document.getElementById("previewBar");
  if(!amt){bar.style.display="none";return;}
  bar.style.display="flex";
  bar.innerHTML=`<span>金額：<strong>NT$ ${parseInt(amt).toLocaleString()}</strong></span><span>大寫：<strong>${toChinese(amt)||"—"}</strong></span><span>發票人：<strong>${issuers.length} 位</strong></span>`;
}
function showMsg(text,type){
  document.getElementById("msgBox").innerHTML=text?`<div class="msg msg-${type}">${text}</div>`:"";
}
async function generate(){
  const amt=document.getElementById("amount").value;
  if(!amt||parseInt(amt)<=0){showMsg("請輸入金額","err");return;}
  if(issuers.length===0){showMsg("請至少新增一位發票人","err");return;}
  for(let i=0;i<issuers.length;i++){
    const iss=issuers[i];
    if(!iss.name){showMsg(`發票人 ${i+1}：請填寫${iss.type==="公司"?"公司名稱":"姓名"}`,"err");return;}
    if(!iss.id){showMsg(`發票人 ${i+1}：請填寫${iss.type==="公司"?"統一編號":"身分證字號"}`,"err");return;}
    if(!validateId(iss.id,iss.type)){showMsg(iss.type==="公司"?`發票人 ${i+1}：統一編號應為8碼數字`:`發票人 ${i+1}：身分證字號應為1碼英文＋9碼數字`,"err");return;}
    if(!iss.address){showMsg(`發票人 ${i+1}：請填寫地址`,"err");return;}
    if(iss.type==="公司"&&!iss.rep){showMsg(`發票人 ${i+1}：請填寫負責人姓名`,"err");return;}
  }
  const btn=document.getElementById("genBtn");
  btn.disabled=true; btn.textContent="載入資源中…"; showMsg("","");
  try{
    const [fontResp,blankResp]=await Promise.all([fetch("font.ttf"),fetch("blank.pdf")]);
    if(!fontResp.ok||!blankResp.ok)throw new Error("無法載入字型或範本，請確認網路連線");
    const [fontBytes,blankBytes]=await Promise.all([fontResp.arrayBuffer(),blankResp.arrayBuffer()]);
    btn.textContent="產生中…";
    const {PDFDocument,rgb}=PDFLib;
    const pdfDoc=await PDFDocument.load(blankBytes);
    pdfDoc.registerFontkit(fontkit);
    const font=await pdfDoc.embedFont(fontBytes);
    const page=pdfDoc.getPages()[0];
    const H=page.getHeight();

    // y 座標：PDF 從底部算，yBottom = yTop + lineHeight(12)
    // drawText 的 y 對齊文字 bottom
    function drawText(text,x,yTop,maxW,sz=10){
      if(!text)return;
      let s=sz;
      while(s>=6){if(font.widthOfTextAtSize(text,s)<=maxW)break;s-=0.5;}
      // 對齊到欄位文字的 baseline（bottom - descent）
      const yBottom=yTop+12; // 原始文字 bottom
      page.drawText(text,{x, y:H-yBottom+1, size:s, font, color:rgb(0,0,0)});
    }
    function drawCenter(text,x0,x1,yBase,sz=10){
      if(!text)return;
      const maxW=x1-x0; let s=sz;
      while(s>=6){if(font.widthOfTextAtSize(text,s)<=maxW)break;s-=0.5;}
      const tw=font.widthOfTextAtSize(text,s);
      page.drawText(text,{x:x0+(maxW-tw)/2, y:H-yBase, size:s, font, color:rgb(0,0,0)});
    }

    const arr=[...issuers];
    while(arr.length<5)arr.push({type:"個人",name:"",id:"",address:"",rep:""});

    // ── 本票金額 8 格 ──
    const digits=String(parseInt(amt)).padStart(8,"0").slice(-8).split("");
    [148,184,220,256,292,328,364,400].forEach((x,i)=>{
      const ch=CN[digits[i]]; const w=font.widthOfTextAtSize(ch,11);
      page.drawText(ch,{x:x+(30-w)/2, y:H-96.3, size:11, font, color:rgb(0,0,0)});
    });

    // ── 聲明書金額 ──
    drawCenter(toChinese(amt),335.0,472.3,571.2);

    // ── 本票發票人（yTop 對應原始文字頂端，bottom = yTop+12）──
    // 發票人欄位 y 對應：name row top, id row top, addr row top
    drawText(nd(arr[0]),125,170.1,200); drawText(arr[0].id,216,190.8,330); drawText(arr[0].address,120,211.7,430);
    drawText(nd(arr[1]),125,252.9,148); drawText(arr[1].id,216,273.6,100); drawText(arr[1].address,120,294.5,148);
    drawText(nd(arr[2]),381,252.9,138); drawText(arr[2].id,470,273.6,85);  drawText(arr[2].address,379,294.5,170);
    drawText(nd(arr[3]),125,335.7,148); drawText(arr[3].id,216,356.4,100); drawText(arr[3].address,120,377.3,148);
    drawText(nd(arr[4]),381,335.7,138); drawText(arr[4].id,470,356.4,85);  drawText(arr[4].address,379,377.3,170);

    // ── 聲明書立書人 ──
    drawCenter(nd(arr[0]),122.9,364.1,684.0);
    drawCenter(nd(arr[1]),125.5,276.7,725.5); drawCenter(nd(arr[2]),397.9,549.4,725.5);
    drawCenter(nd(arr[3]),125.5,276.7,766.8); drawCenter(nd(arr[4]),397.9,549.4,766.8);

    const pdfBytes=await pdfDoc.save();
    const blob=new Blob([pdfBytes],{type:"application/pdf"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`本票_${arr[0].name}_${parseInt(amt).toLocaleString()}元.pdf`;
    a.click(); URL.revokeObjectURL(url);
    showMsg("✓ 本票 PDF 已下載成功","ok");
  }catch(e){
    showMsg("產生失敗："+e.message,"err");
    console.error(e);
  }finally{
    btn.disabled=false; btn.textContent="產生並下載本票 PDF";
  }
}
addIssuer();
</script>
</body>
</html>
